[pytest]
# This repository has no async tests. A globally auto-loaded pytest-asyncio can be
# incompatible with pytest 9 and crashes collection with:
#   AttributeError: 'Package' object has no attribute 'obj'
# Disable that plugin repo-locally so the LITERAL command `pytest -q` works without
# PYTEST_DISABLE_PLUGIN_AUTOLOAD, without `-p no:asyncio`, and without any manual step.
addopts = -p no:asyncio
# Bare `pytest` does not put the CWD on sys.path the way `python -m pytest` does;
# one test module imports the top-level `control_plane` package. Pin the rootdir on
# sys.path so the LITERAL command collects cleanly without manual PYTHONPATH.
pythonpath = .
